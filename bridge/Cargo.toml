[package]
name = "sodaplus-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "CLI bridge from SodaPlus (Swift) to libresoda"
rust-version = "1.89"

[[bin]]
name = "sodaplus-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libresoda = { path = "../Vendor/libresoda", optional = true }

[features]
default = []
libresoda = ["dep:libresoda", "cdp"]
cdp = []
